services:
  # Hexo 生成器容器（只负责生成静态文件，不常驻运行）
  hexo:
    build: .
    container_name: hexo-generator
    volumes:
      - ./source:/app/source          # 文章源
      - ./themes:/app/themes          # 主题
      - ./_config.yml:/app/_config.yml
      - public_data:/app/public       # 将 public 目录存为卷，供 nginx 使用
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=production
    # 不设置 command，由外部调用 hexo g
    command: ["hexo", "g"]            # 启动时生成一次，但容器会立即退出
    restart: "no"                     # 不需要常驻

  # Nginx 静态服务器
  nginx:
    image: nginx:alpine
    container_name: hexo-nginx
    ports:
      - "80:80"                       # 将宿主机 80 端口映射到容器 80
    volumes:
      - public_data:/usr/share/nginx/html:ro   # 挂载 public 卷，只读
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  # 可选自定义配置
    depends_on:
      - hexo
    restart: unless-stopped

volumes:
  public_data:      # 定义命名卷，用于共享 public 目录
  node_modules: