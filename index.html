    <div class="post-body" itemprop="articleBody">
          <h2 id="学习-Gradle"><a href="#学习-Gradle" class="headerlink" title="学习 Gradle"></a>学习 Gradle</h2><p>修改二进制包下载地址，在使用官方下载地址时出现下载不下来的情况。将地址修改为国内地址加速下载。</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br></pre></td><td class="code"><pre><span class="line">#Sat Aug 02 22:16:06 CST 2025</span><br><span class="line">distributionBase=GRADLE_USER_HOME</span><br><span class="line">distributionPath=wrapper/dists</span><br><span class="line">#distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip</span><br><span class="line">distributionUrl=https\://repo.huaweicloud.com/gradle/gradle-8.13-bin.zip</span><br><span class="line"></span><br><span class="line">zipStoreBase=GRADLE_USER_HOME</span><br><span class="line">zipStorePath=wrapper/dists</span><br><span class="line"></span><br></pre></td></tr></table></figure>

<p>Gradle 项目在拉取依赖时非常慢，需要将依赖源修改为阿里源，加快依赖拉取速度。</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line">maven&#123; url &#x27;https://maven.aliyun.com/repository/central&#x27; &#125;</span><br><span class="line">maven&#123; url &#x27;https://maven.aliyun.com/repository/public&#x27; &#125;</span><br><span class="line">maven&#123; url &#x27;https://maven.aliyun.com/repository/gradle-plugin&#x27;&#125;</span><br></pre></td></tr></table></figure>

      
    </div>
